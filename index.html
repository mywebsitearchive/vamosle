            createFromArray();

                squares.push({id: i, letter: "", color: 0, locked: false, current: i == 0});
            }
            createFromArray();
        }
        const addToScreen = (letter) => {
            if(!gameEnded){
                const guessArray = []; 
                for(let i in squares){ // push every letter so far, to the guessarray
                    if(squares[i].letter != ""){
                        guessArray.push(squares[i].letter)
                    }
                };

                    if(currentSquareNumber > 0){
                        squares[currentSquareNumber] = {
                            ...squares[currentSquareNumber],
                            current : false,
                        };
                        squares[currentSquareNumber-1] = {
                            ...squares[currentSquareNumber-1],
                            letter : "",
                            current : true,
                        };
                        currentSquareNumber--;
                    }
                }
                else if(letter == "Enter"){ // call updaterows to correctly color the old guesses

                        if(fullName == correctPlayer.join().replaceAll(",","")){

                        }

                        updateRows();
                        currentSquareNumber = 0;
                        initSquares();
                    }
                    else{

                // letter : string

            ]

                    usedLetters.push(x[i]);
                }
            }
            for(let i in usedLetters){ // go through each letter once
                let count = 0;
                for(let j in x){ // go through the word
                    if(x[j] == usedLetters[i]){

                    }
                }
                lettersCount.push({letter : usedLetters[i], count : count})
