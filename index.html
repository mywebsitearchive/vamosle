        const screenElement = document.getElementById("screen");

        const rnd = Math.floor(Math.random()*100);
        const correctPlayer = players[rnd].split("");
        console.log(correctPlayer)

        const isLetter = (char) => {
            return char.toLowerCase() != char.toUpperCase();
        };
        const addToScreen = (letter) => {
            const currentRowElement = document.getElementById("currentrow");
            if(letter == "Backspace"){
                currentScreen.pop();
            }
            else if(letter == "Enter" && currentScreen.length > 0){
                const fullName = currentScreen.join().replaceAll(",","").toLowerCase();
                const nameArray = fullName.split(" ").filter((name) => name != "");
                let wrongNameGiven = false;
                for(let i in nameArray){
                    if(!playersStr.players.split(" ").includes(nameArray[i])){
                        wrongNameGiven = true;
                    }
                };
                if(!wrongNameGiven){
                    console.log("You guessed the name: "+fullName);
                    oldGuesses.push(currentScreen);
                    updateTable(currentScreen);
                    currentScreen = [];
                }
                else{
                    console.log("Illegitimate guess: "+fullName);
                }
            }
            else if(currentScreen.length < 24){
                if(letter == "Escape"){
                    currentScreen = [];
                }
                else if(letter.length == 1 && (isLetter(letter) || letter == " ")){
                    currentScreen.push(letter.toLowerCase());
                }
            };
            currentRowElement.innerHTML = "";
            for(let i in currentScreen){
                currentRowElement.innerHTML += `<div class="letter">${currentScreen[i].toUpperCase()}</div>`
            };
            for(let i = 0; i < 24 - currentScreen.length; i++){
                currentRowElement.innerHTML += `<div class="letter"></div>`
            };
            currentRowElement.scrollIntoView();
        };
        const updateTable = (input) => {
            let completedRow = ""; // string html of the recently completed row
            let gameOver = true;
            for(let i in input){
                if(input[i] == " "){
                    completedRow += `<div class="letter"></div>`
                }
                else if(input[i] == correctPlayer[i]){
                    completedRow += `<div class="rightplaceletter">${input[i].toUpperCase()}</div>`
                    greens.push(input[i]);
                }
                // else if(input[i] == correctPlayer[i]){
                //     completedRow += `<div class="rightplaceletter">${input[i].toUpperCase()}</div>`
                // }
                else if(correctPlayer.includes(input[i])){
                    completedRow += `<div class="foundletter">${input[i].toUpperCase()}</div>`
                    yellows.push(input[i]);
                    gameOver = false;
                }
                else{
                    completedRow += `<div class="letter">${input[i].toUpperCase()}</div>`
                    blacks.push(input[i]);
                    gameOver = false;
                };
            };
            oldRows.push(`<div class="row">${completedRow}</div>`);

                formerRows += oldRows[i]
            };
